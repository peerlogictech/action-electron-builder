name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        package_manager: [npm, yarn]
        package_root: ["./test/app-in-root/", "./test/app-in-subdirectory/", "./test/vue-app"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies for legacy Yarn Vue fixture
        if: matrix.package_manager == 'yarn' && matrix.package_root == './test/vue-app'
        working-directory: ${{ matrix.package_root }}
        run: yarn install --ignore-engines

      - name: Install other test app dependencies
        if: matrix.package_manager != 'yarn' || matrix.package_root != './test/vue-app'
        working-directory: ${{ matrix.package_root }}
        run: ${{ matrix.package_manager }} install

      - name: Run action without publishing
        uses: ./
        with:
          github_token: ${{ github.token }}
          package_root: ${{ matrix.package_root }}
          use_vue_cli: ${{ contains(matrix.package_root, 'vue')}}
          max_attempts: "2"
          release: "false"
          args: "--publish never"
