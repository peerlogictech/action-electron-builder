name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        package_manager: [npm, yarn]
        package_root: ["./test/app-in-root/", "./test/app-in-subdirectory/", "./test/vue-app"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install test app dependencies
        run: |
          cd "${{ matrix.package_root }}"
          if [ "${{ matrix.package_manager }}" = "yarn" ] && [ "${{ matrix.package_root }}" = "./test/vue-app" ]; then
            # This legacy fixture has conflicting Node engine ranges in transitive dependencies.
            yarn install --ignore-engines
          else
            ${{ matrix.package_manager }} install
          fi

      - name: Run action without publishing
        uses: ./
        with:
          github_token: ${{ github.token }}
          package_root: ${{ matrix.package_root }}
          use_vue_cli: ${{ contains(matrix.package_root, 'vue')}}
          max_attempts: "2"
          release: "false"
          args: "--publish never"
